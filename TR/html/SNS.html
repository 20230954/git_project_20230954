    <!-- 공통 스타일 시트 연결 -->
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* 햄버거바 드롭다운 메뉴 스타일 (클릭 유지형) */
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 8px;
            background-color: #14112B;
            min-width: 150px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.5);
            border: 1px solid rgba(212, 175, 55, 0.3);
            z-index: 50;
            border-radius: 0.5rem;
            overflow: hidden;
        }
        .dropdown-content.show {
            display: block;
        }
        .dropdown-content a {
            color: #cbd5e1;
            padding: 10px 14px;
            text-decoration: none;
            display: block;
            font-size: 12px;
            transition: 0.2s;
        }
        .dropdown-content a:hover {
            background-color: #1D1A3C;
            color: #f8eebe;
        }
    </style>
</head>

                           class="inline-flex items-center gap-2 py-2.5 px-4 rounded-lg bg-gold-500/20 border border-gold-500/40 text-gold-200 hover:bg-gold-500/30 text-xs sm:text-sm transition font-batang shadow">

    <!-- Footer -->

    </footer>

    <!-- 드롭다운 메뉴 및 배경 별 생성 스크립트 -->
    <script>
        function toggleDropdown(event) {
            event.stopPropagation();
            const menu = document.getElementById('dropdown-menu');
            if (menu) {
                menu.classList.toggle('show');
            }
        }

        window.addEventListener('click', function(event) {
            const menu = document.getElementById('dropdown-menu');
            if (menu && menu.classList.contains('show')) {
                menu.classList.remove('show');
            }
        });

        // 별 배경 동적 생성
        window.addEventListener('DOMContentLoaded', () => {
            const starsContainer = document.getElementById('stars');
            if (starsContainer) {
                starsContainer.innerHTML = '';
                for (let i = 0; i < 60; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    const size = Math.random() * 2.5 + 1;
                    star.style.width = `${size}px`;
                    star.style.height = `${size}px`;
                    star.style.left = `${Math.random() * 100}%`;
                    star.style.top = `${Math.random() * 100}%`;
                    star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
                    star.style.setProperty('--delay', `${Math.random() * 3}s`);
                    starsContainer.appendChild(star);
                }
            }
        });
    </script>
</body>
