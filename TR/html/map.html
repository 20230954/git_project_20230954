<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오시는 길 (지도) - Mystical Tarot Reading</title>
        <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Cinzel:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: {
                            100: '#fdf8e6',
                            200: '#f8eebe',
                            300: '#f3e5ab',
                            400: '#e6ca65',
                            500: '#d4af37',
                            600: '#aa8c2c',
                            700: '#806820',
                        },
                        mystic: {
                            950: '#070512',
                            900: '#0B091A',
                            800: '#14112B',
                            700: '#1D1A3C',
                            600: '#2A2654',
                            500: '#3D3875',
                            400: '#5852A3',
                        }
                    },
                    fontFamily: {
                        batang: ['Gowun Batang', 'serif'],
                        sans: ['Noto Sans KR', 'sans-serif'],
                        cinzel: ['Cinzel', 'serif']
                    }
                }
            }
        }
    </script>
    <!-- 공통 스타일 시트 연결 -->
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* 햄버거바 드롭다운 메뉴 스타일 (클릭 유지형) */
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 8px;
            background-color: #14112B;
            min-width: 150px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.5);
            border: 1px solid rgba(212, 175, 55, 0.3);
            z-index: 50;
            border-radius: 0.5rem;
            overflow: hidden;
        }
        .dropdown-content.show {
            display: block;
        }
        .dropdown-content a {
            color: #cbd5e1;
            padding: 10px 14px;
            text-decoration: none;
            display: block;
            font-size: 12px;
            transition: 0.2s;
        }
        .dropdown-content a:hover {
            background-color: #1D1A3C;
            color: #f8eebe;
        }
    </style>
</head>
<body class="min-h-screen relative flex flex-col justify-between">

    <!-- Starry Background -->
    <div id="stars" class="stars-container"></div>

    <!-- Header / Navbar Controls -->
    <header class="relative z-20 container mx-auto px-4 pt-6 pb-2 flex flex-wrap items-center justify-between border-b border-mystic-800/80">
        <div class="flex items-center gap-3 cursor-pointer" onclick="location.href='index.html'">
            <div class="w-10 h-10 rounded-full bg-gold-500/20 border border-gold-500/50 flex items-center justify-center text-gold-300 shadow">
                <i class="fa-solid fa-sparkles text-lg"></i>
            </div>
            <div>
                <span class="font-cinzel text-lg font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-gold-200 via-gold-400 to-amber-300">
                    MYSTICAL TAROT
                </span>
                <p class="text-[10px] text-slate-400 font-batang tracking-wider">영혼의 울림과 신비로운 직관</p>
            </div>
        </div>

        <!-- Control Buttons: 메인으로 가기 버튼 & 우측 햄버거 메뉴 -->
        <div class="flex items-center gap-3 mt-3 sm:mt-0">
            <button onclick="location.href='index.html'" class="px-3 py-1.5 rounded-full bg-mystic-800/80 border border-mystic-600 hover:border-gold-400 text-slate-300 text-xs flex items-center gap-2 transition backdrop-blur">
                <i class="fa-solid fa-house"></i>
                <span>메인으로</span>
            </button>

            <!-- 햄버거바 드롭다운 메뉴 (SNS 페이지와 동일한 구성) -->
            <div class="dropdown">
                <button onclick="toggleDropdown(event)" class="px-3.5 py-1.5 rounded-full bg-mystic-800/80 border border-gold-500/30 hover:border-gold-400 text-gold-300 text-xs flex items-center gap-2 transition backdrop-blur shadow cursor-pointer">
                    <i class="fa-solid fa-bars text-sm"></i>
                    <span>메뉴</span>
                </button>
                <div id="dropdown-menu" class="dropdown-content">
                    <a href="index.html"><i class="fa-solid fa-house mr-1.5"></i> 홈으로</a>
                    <a href="map.html" class="text-gold-300 font-bold bg-mystic-700/50"><i class="fa-solid fa-map-location-dot mr-1.5"></i> 오시는 길 (지도)</a>
                    <a href="SNS.html"><i class="fa-solid fa-share-nodes mr-1.5"></i> SNS 경로</a>
                    <a href="talk.html"><i class="fa-solid fa-comments mr-1.5"></i> 소통 게시판</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="relative z-10 container mx-auto px-4 py-12 max-w-2xl flex-grow flex flex-col items-center">
        <div class="w-full bg-mystic-800/80 backdrop-blur-md border border-gold-500/30 rounded-2xl p-6 sm:p-8 shadow-2xl">
            
            <div class="text-center mb-8">
                <div class="inline-block p-2 rounded-full border border-gold-500/30 mb-3 bg-mystic-900/60 backdrop-blur">
                    <span class="font-cinzel text-gold-400 text-xs tracking-widest px-3">✨ LOCATION GUIDE ✨</span>
                </div>
                <h1 class="text-2xl sm:text-3xl font-bold font-batang text-transparent bg-clip-text bg-gradient-to-r from-gold-200 via-gold-400 to-amber-200 tracking-wide mb-2">
                    오시는 길
                </h1>
                <p class="text-slate-400 text-xs sm:text-sm font-light">
                    타로 리딩 및 주요 활동 위치 정보입니다.
                </p>
            </div>

            <!-- Location Cards -->
            <div class="space-y-4">
                
                <!-- 1. 장안대학교 정보통신관 -->
                <div class="bg-mystic-900/60 border border-gold-500/20 rounded-xl p-5 transition hover:border-gold-500/50">
                    <h2 class="text-gold-300 font-batang font-bold text-base sm:text-lg mb-2 flex items-center gap-2">
                        <i class="fa-solid fa-building-columns text-gold-400"></i> 장안대학교 정보통신관
                    </h2>
                    <p class="text-xs text-slate-400 mb-4">경기도 화성시 향남읍에 위치한 정보통신 교육 및 연구 공간입니다.</p>
                    <div>
                        <a href="https://www.google.com/maps/place/%EC%9E%A5%EC%95%88%EB%8C%80%ED%95%99%EA%B5%90+%EC%A0%95%EB%B3%B4%ED%86%B5%EC%8B%A0%EA%B4%80/data=!4m4!3m3!1s0x357b6a716a1fb313:0xe2756df137fd42fd!16s%2Fg%2F11sskr4fvx!20s8Q986W6W%2BFWPJ7GH?entry=ttu&g_ep=EgoyMDI2MDkyMy4wIKXMDSoASAFQAw%3D%3D" 
                           class="inline-flex items-center gap-2 py-2.5 px-4 rounded-lg bg-gold-500/20 border border-gold-500/40 text-gold-200 hover:bg-gold-500/30 text-xs sm:text-sm transition font-batang shadow" 
                           target="_blank">
                            <i class="fa-solid fa-map-pin"></i> 장안대학교 정보통신관 지도 보기
                        </a>
                    </div>
                </div>

                <!-- 2. 동탄 목동 -->
                <div class="bg-mystic-900/60 border border-gold-500/20 rounded-xl p-5 transition hover:border-gold-500/50">
                    <h2 class="text-gold-300 font-batang font-bold text-base sm:text-lg mb-2 flex items-center gap-2">
                        <i class="fa-solid fa-map-location-dot text-gold-400"></i> 동탄 목동
                    </h2>
                    <p class="text-xs text-slate-400 mb-4">경기도 화성시 동탄 목동 지역 위치 정보입니다.</p>
                    <div>
                        <a href="https://www.google.com/maps/search/%EA%B2%BD%EA%B8%B0%EB%8F%84+%ED%99%94%EC%84%B1%EC%8B%9C+7%EB%AA%A9%EB%8F%99/data=!3m1!4b1?entry=ttu&g_ep=EgoyMDI2MDkyMy4wIKXMDSoASAFQAw%3D%3D" 
                           class="inline-flex items-center gap-2 py-2.5 px-4 rounded-lg bg-gold-500/20 border border-gold-500/40 text-gold-200 hover:bg-gold-500/30 text-xs sm:text-sm transition font-batang shadow" 
                           target="_blank">
                            <i class="fa-solid fa-map-pin"></i> 동탄 목동 지도 보기
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="relative z-10 text-center py-6 text-xs text-slate-500 border-t border-mystic-800/80 bg-mystic-950/50">
        <p>© 2026 Mystical Tarot Reading • 신비로운 영혼의 지혜</p>
    </footer>

    <!-- 드롭다운 메뉴 및 배경 별 생성 스크립트 -->
    <script>
        function toggleDropdown(event) {
            event.stopPropagation();
            const menu = document.getElementById('dropdown-menu');
            if (menu) {
                menu.classList.toggle('show');
            }
        }

        window.addEventListener('click', function(event) {
            const menu = document.getElementById('dropdown-menu');
            if (menu && menu.classList.contains('show')) {
                menu.classList.remove('show');
            }
        });

        // 별 배경 동적 생성
        window.addEventListener('DOMContentLoaded', () => {
            const starsContainer = document.getElementById('stars');
            if (starsContainer) {
                starsContainer.innerHTML = '';
                for (let i = 0; i < 60; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    const size = Math.random() * 2.5 + 1;
                    star.style.width = `${size}px`;
                    star.style.height = `${size}px`;
                    star.style.left = `${Math.random() * 100}%`;
                    star.style.top = `${Math.random() * 100}%`;
                    star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
                    star.style.setProperty('--delay', `${Math.random() * 3}s`);
                    starsContainer.appendChild(star);
                }
            }
        });
    </script>
</body>
</html>
