<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - Mystical Tarot Reading</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Cinzel:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: {
                            100: '#fdf8e6',
                            200: '#f8eebe',
                            300: '#f3e5ab',
                            400: '#e6ca65',
                            500: '#d4af37',
                            600: '#aa8c2c',
                            700: '#806820',
                        },
                        mystic: {
                            950: '#070512',
                            900: '#0B091A',
                            800: '#14112B',
                            700: '#1D1A3C',
                            600: '#2A2654',
                            500: '#3D3875',
                            400: '#5852A3',
                        }
                    },
                    fontFamily: {
                        batang: ['Gowun Batang', 'serif'],
                        sans: ['Noto Sans KR', 'sans-serif'],
                        cinzel: ['Cinzel', 'serif']
                    }
                }
            }
        }
    </script>
    <!-- 공통 스타일 시트 연결 -->
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* 햄버거바 드롭다운 메뉴 스타일 */
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 8px;
            background-color: #14112B;
            min-width: 150px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.5);
            border: 1px solid rgba(212, 175, 55, 0.3);
            z-index: 50;
            border-radius: 0.5rem;
            overflow: hidden;
        }
        .dropdown-content.show {
            display: block;
        }
        .dropdown-content a {
            color: #cbd5e1;
            padding: 10px 14px;
            text-decoration: none;
            display: block;
            font-size: 12px;
            transition: 0.2s;
        }
        .dropdown-content a:hover {
            background-color: #1D1A3C;
            color: #f8eebe;
        }
    </style>
</head>
<body class="min-h-screen relative flex flex-col justify-between">

    <!-- Starry Background -->
    <div id="stars" class="stars-container"></div>

    <!-- Header / Navbar Controls -->
    <header class="relative z-20 container mx-auto px-4 pt-6 pb-2 flex flex-wrap items-center justify-between border-b border-mystic-800/80">
        <div class="flex items-center gap-3 cursor-pointer" onclick="location.href='index.html'">
            <div class="w-10 h-10 rounded-full bg-gold-500/20 border border-gold-500/50 flex items-center justify-center text-gold-300 shadow">
                <i class="fa-solid fa-sparkles text-lg"></i>
            </div>
            <div>
                <span class="font-cinzel text-lg font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-gold-200 via-gold-400 to-amber-300">
                    MYSTICAL TAROT
                </span>
                <p class="text-[10px] text-slate-400 font-batang tracking-wider">영혼의 울림과 신비로운 직관</p>
            </div>
        </div>

        <!-- Control Buttons -->
        <div class="flex items-center gap-3 mt-3 sm:mt-0">
            <button onclick="location.href='index.html'" class="px-3 py-1.5 rounded-full bg-mystic-800/80 border border-mystic-600 hover:border-gold-400 text-slate-300 text-xs flex items-center gap-2 transition backdrop-blur cursor-pointer">
                <i class="fa-solid fa-house"></i>
                <span>메인으로</span>
            </button>

            <!-- 햄버거바 드롭다운 메뉴 -->
            <div class="dropdown">
                <button onclick="toggleDropdown(event)" class="px-3.5 py-1.5 rounded-full bg-mystic-800/80 border border-gold-500/30 hover:border-gold-400 text-gold-300 text-xs flex items-center gap-2 transition backdrop-blur shadow cursor-pointer">
                    <i class="fa-solid fa-bars text-sm"></i>
                    <span>메뉴</span>
                </button>
                <div id="dropdown-menu" class="dropdown-content">
                    <a href="index.html"><i class="fa-solid fa-house mr-1.5"></i> 홈으로</a>
                    <a href="login.html"><i class="fa-solid fa-right-to-bracket mr-1.5"></i> 로그인</a>
                    <a href="signup.html" class="text-gold-300 font-bold bg-mystic-700/50"><i class="fa-solid fa-user-plus mr-1.5"></i> 회원가입</a>
                    <a href="map.html"><i class="fa-solid fa-map-location-dot mr-1.5"></i> 오시는 길</a>
                    <a href="talk.html"><i class="fa-solid fa-comments mr-1.5"></i> 소통 게시판</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="relative z-10 container mx-auto px-4 py-12 max-w-md flex-grow flex flex-col items-center justify-center">
        <div class="w-full bg-mystic-800/80 backdrop-blur-md border border-gold-500/30 rounded-2xl p-6 sm:p-8 shadow-2xl">
            
            <div class="text-center mb-6">
                <div class="inline-block p-2 rounded-full border border-gold-500/30 mb-3 bg-mystic-900/60 backdrop-blur">
                    <span class="font-cinzel text-gold-400 text-xs tracking-widest px-3">✨ MEMBER REGISTRATION ✨</span>
                </div>
                <h1 class="text-2xl sm:text-3xl font-bold font-batang text-transparent bg-clip-text bg-gradient-to-r from-gold-200 via-gold-400 to-amber-200 tracking-wide mb-2">
                    회원가입
                </h1>
                <p class="text-slate-400 text-xs font-light">
                    신비로운 타로 여정에 함께할 계정을 만들어보세요.
                </p>
            </div>

            <!-- 회원가입 폼 -->
            <form id="signup-form" onsubmit="handleSignup(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-batang text-gold-300 mb-1">아이디 (이메일)</label>
                    <input type="email" id="signup-email" required placeholder="example@tarot.com" 
                           class="w-full bg-mystic-950 border border-mystic-600 rounded-lg px-3 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-gold-400">
                </div>
                <div>
                    <label class="block text-xs font-batang text-gold-300 mb-1">비밀번호</label>
                    <input type="password" id="signup-pw" required placeholder="비밀번호를 입력하세요" 
                           class="w-full bg-mystic-950 border border-mystic-600 rounded-lg px-3 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-gold-400">
                </div>
                <div>
                    <label class="block text-xs font-batang text-gold-300 mb-1">비밀번호 확인</label>
                    <input type="password" id="signup-pw-check" required placeholder="비밀번호를 다시 입력하세요" 
                           class="w-full bg-mystic-950 border border-mystic-600 rounded-lg px-3 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-gold-400">
                </div>
                <div>
                    <label class="block text-xs font-batang text-gold-300 mb-1">닉네임</label>
                    <input type="text" id="signup-name" required placeholder="사용하실 닉네임" 
                           class="w-full bg-mystic-950 border border-mystic-600 rounded-lg px-3 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-gold-400">
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-gold-600 to-amber-500 text-mystic-950 font-bold font-batang text-sm transition shadow-lg hover:brightness-110 cursor-pointer">
                        <i class="fa-solid fa-user-plus mr-1"></i> 가입 완료하기
                    </button>
                </div>
            </form>

            <div class="mt-6 text-center text-xs text-slate-400 border-t border-mystic-700/60 pt-4">
                이미 계정이 있으신가요? 
                <a href="login.html" class="text-gold-300 font-bold hover:underline ml-1">로그인하기</a>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="relative z-10 text-center py-6 text-xs text-slate-500 border-t border-mystic-800/80 bg-mystic-950/50">
        <p>© 2026 Mystical Tarot Reading • 신비로운 영혼의 지혜</p>
    </footer>

    <!-- 스크립트 로직 -->
    <script>
        // 드롭다운 메뉴 토글
        function toggleDropdown(event) {
            event.stopPropagation();
            const menu = document.getElementById('dropdown-menu');
            if (menu) {
                menu.classList.toggle('show');
            }
        }

        window.addEventListener('click', function(event) {
            const menu = document.getElementById('dropdown-menu');
            if (menu && menu.classList.contains('show')) {
                menu.classList.remove('show');
            }
        });

        // 별 배경 동적 생성
        window.addEventListener('DOMContentLoaded', () => {
            const starsContainer = document.getElementById('stars');
            if (starsContainer) {
                starsContainer.innerHTML = '';
                for (let i = 0; i < 60; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    const size = Math.random() * 2.5 + 1;
                    star.style.width = `${size}px`;
                    star.style.height = `${size}px`;
                    star.style.left = `${Math.random() * 100}%`;
                    star.style.top = `${Math.random() * 100}%`;
                    star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
                    star.style.setProperty('--delay', `${Math.random() * 3}s`);
                    starsContainer.appendChild(star);
                }
            }
        });

        // 회원가입 처리 로직
        function handleSignup(event) {
            event.preventDefault();
            const email = document.getElementById('signup-email').value.trim();
            const pw = document.getElementById('signup-pw').value;
            const pwCheck = document.getElementById('signup-pw-check').value;
            const name = document.getElementById('signup-name').value.trim();

            if (pw !== pwCheck) {
                alert("비밀번호가 일치하지 않습니다. 다시 확인해주세요.");
                return;
            }

            // 기존 회원 목록 불러오기
            let users = JSON.parse(localStorage.getItem('tarot_users')) || [];

            // 중복 이메일 체크
            const existingUser = users.find(u => u.email === email);
            if (existingUser) {
                alert("이미 가입된 이메일(아이디)입니다.");
                return;
            }

            // 새 회원 정보 저장
            users.push({ email, pw, name });
            localStorage.setItem('tarot_users', JSON.stringify(users));

            alert("회원가입이 완료되었습니다! 로그인 페이지로 이동합니다.");
            location.href = 'login.html';
        }
    </script>
</body>
</html>
