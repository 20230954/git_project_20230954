<!DOCTYPE html>                       <!-- 문서 유형 선언 -->
<html>                                <!-- HTML5 문서의 시작 -->
<head>                                <!-- 머리글(문서 설명 정보)의 시작 -->
    <meta charset="utf-8">            <!-- 문서의 인코딩 설정 -->
    <title>HTML5 문서 제목</title>       <!-- 문서 제목(브라우저 상단에 표시됨) -->
</head>                               <!-- 머리글의 종료 -->
<body>                                <!-- 문서 본문 시작 -->
    <h1>HTML이란?</h1>                <!-- 문서 본문(글 제목) -->
    HyperText Markup Language의 약어   <!-- 문서 본문(글 내용) -->
</body>                               <!-- 문서 본문 종료 -->
</html>                               <!-- HTML5 문서의 끝 -->
