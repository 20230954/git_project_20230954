<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6fb">
  <title>행운의 로또 번호</title>
  <link rel="stylesheet" href="css/Lotto.css">
  <script src="js/Lotto.js" defer></script>
</head>
<body>
  <main class="lotto">
    <header class="heading">
      <p class="eyebrow">LUCKY NUMBER PICKER</p>
      <h1>행운의 로또 번호</h1>
      <p class="description">버튼을 눌러 오늘의 행운 번호를 뽑아보세요.</p>
    </header>

    <section class="draw-card" aria-label="로또 번호 생성기">
      <div class="draw-info">
        <span>이번 회차 행운 번호</span>
        <span class="count">생성 횟수 <strong id="draw-count">0</strong>회</span>
      </div>
      <ol class="numbers" id="numbers" aria-live="polite" aria-label="당첨 번호">
        <li class="placeholder">?</li>
        <li class="placeholder">?</li>
        <li class="placeholder">?</li>
        <li class="placeholder">?</li>
        <li class="placeholder">?</li>
        <li class="placeholder">?</li>
      </ol>
      <p class="message" id="message">번호 뽑기를 눌러 시작하세요.</p>
      <div class="actions">
        <button class="draw-button" id="draw-button" type="button">번호 뽑기</button>
        <button class="reset-button" id="reset-button" type="button">초기화</button>
      </div>
    </section>
    <section class="frequency-card" aria-labelledby="frequency-title">
      <div class="frequency-heading">
        <div>
          <h2 id="frequency-title">번호별 누적 출현 횟수</h2>
          <p>지금까지 생성한 번호를 기준으로 집계합니다.</p>
        </div>
        <p class="most-frequent" id="most-frequent" aria-live="polite">아직 추첨 기록이 없습니다.</p>
      </div>
      <ol class="frequency-list" id="frequency-list" aria-label="1부터 45까지 번호별 출현 횟수"></ol>
    </section>
    <p class="note">1부터 45까지의 숫자 중 중복 없이 6개를 뽑습니다.</p>
  </main>
</body>
</html>
